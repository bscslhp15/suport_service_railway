<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Support Services System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .offline-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            max-width: 500px;
            text-align: center;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .offline-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: #f0f0f0;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .status {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        p {
            color: #888;
            line-height: 1.6;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-direction: column;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .tips {
            background: #f9f9f9;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-top: 30px;
            text-align: left;
            border-radius: 4px;
        }

        .tips h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .tips ul {
            list-style: none;
            color: #666;
            font-size: 14px;
        }

        .tips li {
            margin-bottom: 8px;
            padding-left: 20px;
            position: relative;
        }

        .tips li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #667eea;
            font-weight: bold;
        }

        .connection-status {
            display: inline-block;
            padding: 8px 15px;
            background: #ffe0e0;
            color: #d32f2f;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        @media (max-width: 600px) {
            .offline-container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }

            p {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">📡</div>
        <div class="connection-status">No Internet Connection</div>
        <h1>You're Offline</h1>
        <p class="status">Unable to Connect</p>
        <p>We couldn't connect to the server. Please check your internet connection and try again.</p>

        <div class="actions">
            <button class="btn-primary" onclick="location.reload()">
                Try Again
            </button>
            <button class="btn-secondary" onclick="goHome()">
                Go to Home
            </button>
        </div>

        <div class="tips">
            <h3>What you can do:</h3>
            <ul>
                <li>Check your internet connection</li>
                <li>Try again in a few moments</li>
                <li>Cached pages may still be available</li>
            </ul>
        </div>
    </div>

    <script>
        function goHome() {
            window.location.href = '/THESIS/SUPPORTSERVICESYSTEM/index.php';
        }

        // Optional: Check connection periodically
        window.addEventListener('online', () => {
            console.log('[Offline Page] Connection restored');
            location.reload();
        });

        console.log('[Offline Page] Loaded');
    </script>
</body>
</html>
